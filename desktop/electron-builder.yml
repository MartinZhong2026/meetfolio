appId: org.meetfolio.desktop.preview
productName: Meetfolio Preview
executableName: MeetfolioPreview
copyright: Copyright © 2026 Martin Zhong
asar: true
electronDist: node_modules/electron/dist
afterPack: desktop/scripts/check-pack.cjs
npmRebuild: false
buildDependenciesFromSource: false
directories:
  app: desktop
  output: work/phase5/packages
files:
  - dist/**/*.cjs
  - package.json
extraResources:
  - from: work/desktop-runtime/xasr
    to: xasr
  - from: work/desktop-runtime/xasr/node_modules
    to: xasr/node_modules
    filter: ["**/*"]
  - from: web/dist-desktop
    to: ui
  - from: docs/third-party
    to: licenses
  - from: desktop/assets
    to: branding
    filter: [meetfolio.ico, meetfolio.png]
  - from: LICENSE
    to: licenses/Meetfolio-LICENSE
win:
  icon: desktop/assets/meetfolio.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch: [x64]
  artifactName: Meetfolio-${version}-windows-x64-setup.${ext}
nsis:
  include: desktop/installer.nsh
  oneClick: false
  perMachine: false
  selectPerMachineByDefault: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Meetfolio Preview
  installerIcon: desktop/assets/meetfolio.ico
  uninstallerIcon: desktop/assets/meetfolio.ico
  installerHeader: desktop/assets/installer-header.bmp
  installerSidebar: desktop/assets/installer-sidebar.bmp
  uninstallerSidebar: desktop/assets/installer-sidebar.bmp
  installerLanguages: [en_US, zh_CN, zh_TW]
  language: "2052"
  unicode: true
linux:
  target: dir
mac:
  icon: desktop/assets/meetfolio.icns
  target: [dmg, zip]
  category: public.app-category.productivity
  artifactName: Meetfolio-${version}-macos-${arch}.${ext}
  minimumSystemVersion: '15.0.0'
  identity: '-'
  # Ad-hoc preview only. Developer ID builds must enable hardened runtime + notarization.
  hardenedRuntime: false
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.plist
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: Meetfolio records audio locally for offline transcription after your consent.
    NSAppTransportSecurity:
      NSAllowsArbitraryLoads: false
dmg:
  title: Meetfolio Preview
  sign: false
