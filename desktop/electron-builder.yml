appId: org.meetfolio.desktop
productName: Meetfolio
executableName: Meetfolio
copyright: Copyright © 2026 Martin Zhong
asar: true
electronDist: node_modules/electron/dist
afterPack: desktop/scripts/check-pack.cjs
npmRebuild: false
buildDependenciesFromSource: false
directories:
  app: desktop
  output: work/desktop-packages
files:
  - dist/**/*.cjs
  - package.json
extraResources:
  - from: work/desktop-runtime/xasr
    to: xasr
  - from: work/desktop-runtime/xasr/node_modules
    to: xasr/node_modules
    filter: ["**/*"]
  - from: web/dist-desktop
    to: ui
  - from: docs/third-party
    to: licenses
  - from: desktop/assets
    to: branding
    filter: [meetfolio.ico, meetfolio.png]
  - from: LICENSE
    to: licenses/Meetfolio-LICENSE
win:
  icon: desktop/assets/meetfolio.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch: [x64]
  artifactName: Meetfolio-${version}-windows-x64-setup.${ext}
nsis:
  include: desktop/installer.nsh
  oneClick: false
  perMachine: false
  selectPerMachineByDefault: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Meetfolio
  installerIcon: desktop/assets/meetfolio.ico
  uninstallerIcon: desktop/assets/meetfolio.ico
  installerHeader: desktop/assets/installer-header.bmp
  installerSidebar: desktop/assets/installer-sidebar.bmp
  uninstallerSidebar: desktop/assets/installer-sidebar.bmp
  installerLanguages: [en_US, zh_CN, zh_TW]
  language: "2052"
  unicode: true
linux:
  target: dir
