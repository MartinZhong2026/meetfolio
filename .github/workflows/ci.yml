name: Recovery verification
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node --version && npm --version && npm ci
      - name: Check editable-source whitespace
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          git diff --check "$(git merge-base HEAD origin/main)" HEAD -- . ':(exclude)recovery-reference/**' ':(exclude)docs/**' ':(exclude)RECOVERY_GAP_REPORT.md'
      - run: npm run verify
      - name: Native lifecycle and model-cache tests without database
        run: npm run test -w server -- --config vitest.native.config.ts
      - name: Check production and development dependency advisories
        run: npm audit --audit-level=high

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meetfolio
          POSTGRES_PASSWORD: meetfolio
          POSTGRES_DB: meetfolio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U meetfolio -d meetfolio_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://meetfolio:meetfolio@127.0.0.1:5432/meetfolio_test
      MEETFOLIO_ALLOW_TEST_DB_RESET: meetfolio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Server tests against disposable database
        run: npm run test -w server
      - name: Repeat server tests to check reset and migrations
        run: npm run test -w server

  desktop-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - run: npx playwright install --with-deps chromium
      - run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-browser-failures
          path: web/test-results-desktop/

  web-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meetfolio
          POSTGRES_PASSWORD: meetfolio
          POSTGRES_DB: meetfolio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U meetfolio -d meetfolio_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      E2E_DATABASE_URL: postgres://meetfolio:meetfolio@127.0.0.1:5432/meetfolio_e2e
      MEETFOLIO_ALLOW_TEST_DB_RESET: meetfolio_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-browser-failures
          path: web/test-results/

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=optional
      - name: Prepare checksum-verified Electron binary explicitly
        run: npm run prepare:electron
      - run: npm run build:electron
      - run: node server/scripts/check-xasr-runtime.mjs
      - run: npm run test -w server -- --config vitest.native.config.ts
      - run: npm run test -w desktop
      - name: Actual Electron segment playback with generated tones
        run: node desktop/scripts/playback-smoke.mjs --out work/phase3b2/ci-source
      - name: Verify official model and prepare public speech fixture
        run: node desktop/scripts/prepare-native-fixture.mjs
      - name: Actual Electron, native inference and file-backed microphone (no physical device)
        shell: pwsh
        run: |
          $fixture = Get-Content -Raw work/phase3a/ci-fixture/fixture.json | ConvertFrom-Json
          node desktop/scripts/native-smoke.mjs --archive $fixture.archive --audio $fixture.audio --out work/phase3a/ci-smoke
      - name: Prepare checksum-verified public diarization fixture and speaker models
        run: node desktop/scripts/prepare-import-fixture.mjs
      - name: Actual Electron audio import, diarization, editing, playback and recovery
        shell: pwsh
        run: |
          $fixture = Get-Content -Raw work/phase4/ci-fixture/fixture.json | ConvertFrom-Json
          node desktop/scripts/import-smoke.mjs --audio $fixture.audio --speakers $fixture.speakers --out work/phase4/ci-source
      - name: Prepare pinned optional decoder in isolated test cache
        run: node desktop/scripts/prepare-readiness-fixture.mjs
      - name: Two-hour native file import, checkpoint restart and correction retention
        shell: pwsh
        run: |
          $fixture = Get-Content -Raw work/phase4/ci-fixture/fixture.json | ConvertFrom-Json
          $decoder = Get-Content -Raw work/phase4-1/ci-decoder/fixture.json | ConvertFrom-Json
          node desktop/scripts/readiness-smoke.mjs --decoder $decoder.archive --audio $fixture.audio --speakers $fixture.speakers --out work/phase4-1/ci-source
      - name: Build unsigned review installer without installing or publishing
        run: npx electron-builder --win nsis --x64 --config desktop/electron-builder.yml --publish never
      - run: node desktop/scripts/check-review-package.mjs
      - name: Verify unpacked packaged runtime without installing
        shell: pwsh
        run: |
          $fixture = Get-Content -Raw work/phase3a/ci-fixture/fixture.json | ConvertFrom-Json
          node desktop/scripts/native-smoke.mjs --executable work/phase5/packages/win-unpacked/MeetfolioPreview.exe --archive $fixture.archive --audio $fixture.audio --out work/phase3a/ci-packaged-smoke
      - name: Verify packaged segment playback without installing
        run: node desktop/scripts/playback-smoke.mjs --executable work/phase5/packages/win-unpacked/MeetfolioPreview.exe --out work/phase3b2/ci-packaged
      - name: Verify packaged offline audio import and speaker separation
        shell: pwsh
        run: |
          $fixture = Get-Content -Raw work/phase4/ci-fixture/fixture.json | ConvertFrom-Json
          node desktop/scripts/import-smoke.mjs --executable work/phase5/packages/win-unpacked/MeetfolioPreview.exe --audio $fixture.audio --speakers $fixture.speakers --automatic --out work/phase4/ci-packaged
      - name: Packaged decoder and checkpoint resume without installing
        shell: pwsh
        run: |
          $fixture = Get-Content -Raw work/phase4/ci-fixture/fixture.json | ConvertFrom-Json
          $decoder = Get-Content -Raw work/phase4-1/ci-decoder/fixture.json | ConvertFrom-Json
          node desktop/scripts/readiness-smoke.mjs --executable work/phase5/packages/win-unpacked/MeetfolioPreview.exe --decoder $decoder.archive --audio $fixture.audio --speakers $fixture.speakers --minutes 4 --out work/phase4-1/ci-packaged
      - name: Actual per-user preview installation and normal startup
        run: node desktop/scripts/preview-install.mjs --mode install --installer work/phase5/packages/Meetfolio-0.2.0-preview.1-windows-x64-setup.exe
      - name: Installed preview downloads and verifies the local model
        run: node desktop/scripts/model-download-smoke.mjs --executable work/phase5/installed-check/application/MeetfolioPreview.exe
      - name: Installed preview offline codecs, diarization, playback, edits and checkpoint resume
        shell: pwsh
        run: |
          $fixture = Get-Content -Raw work/phase4/ci-fixture/fixture.json | ConvertFrom-Json
          $decoder = Get-Content -Raw work/phase4-1/ci-decoder/fixture.json | ConvertFrom-Json
          node desktop/scripts/readiness-smoke.mjs --executable work/phase5/installed-check/application/MeetfolioPreview.exe --decoder $decoder.archive --audio $fixture.audio --speakers $fixture.speakers --minutes 4 --out work/phase5/installed-readiness
      - name: Actual preview uninstall retains data
        run: node desktop/scripts/preview-install.mjs --mode uninstall
      - name: Prepare Windows downloads and checksums after verification
        run: node desktop/scripts/preview-artifacts.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: meetfolio-preview-windows-x64
          path: work/phase5/downloads/win32-x64/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-status-only
          path: |
            work/phase3a/ci-smoke/native-smoke.json
            work/phase3a/ci-packaged-smoke/native-smoke.json
            work/phase5/packages/static-review.json
            work/phase3b2/ci-source/playback-smoke.json
            work/phase3b2/ci-packaged/playback-smoke.json
            work/phase4/ci-source/import-smoke.json
            work/phase4/ci-packaged/import-smoke.json
            work/phase4-1/ci-source/readiness-smoke.json
            work/phase4-1/ci-packaged/readiness-smoke.json
            work/phase5/installed-check/installation-status.json
            work/phase5/model-download/download-status.json
            work/phase5/installed-readiness/readiness-smoke.json

  macos-native:
    name: macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require native architecture (no Rosetta / cross compilation)
        run: node -e "if(process.platform!=='darwin'||process.arch!=='${{ matrix.arch }}')process.exit(1)"
      - run: npm ci --include=optional
      - run: npm run prepare:electron
      - run: npm run build:electron
      - run: node server/scripts/check-xasr-runtime.mjs
      - run: npm run test:native-runtime
      - run: npm run test -w desktop
      - name: Verify official model download and native inference preparation
        run: node desktop/scripts/prepare-native-fixture.mjs
      - run: node desktop/scripts/prepare-import-fixture.mjs
      - name: Prepare system decoder and test-only codec encoder
        run: |
          node desktop/scripts/prepare-readiness-fixture.mjs
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
      - name: Actual system-codec stereo sample-rate conversion
        run: node desktop/scripts/mac-decoder-smoke.mjs
      - name: Source system codecs, two-hour import, diarization and restart recovery
        run: |
          audio=$(node -p "JSON.parse(require('fs').readFileSync('work/phase4/ci-fixture/fixture.json')).audio")
          speakers=$(node -p "JSON.parse(require('fs').readFileSync('work/phase4/ci-fixture/fixture.json')).speakers")
          node desktop/scripts/readiness-smoke.mjs --audio "$audio" --speakers "$speakers" --encoder "$(command -v ffmpeg)" --out work/phase5/mac-source
      - name: Build native ad-hoc preview DMG and ZIP (no notarization)
        run: npx electron-builder --mac --${{ matrix.arch }} --config desktop/electron-builder.yml --publish never
      - name: Mount actual DMG, copy app and verify normal startup / architecture / signatures
        run: node desktop/scripts/mac-preview-install.mjs --mode install
      - name: Copied preview downloads and verifies the local model
        run: node desktop/scripts/model-download-smoke.mjs --executable 'work/phase5/mac-installed/MeetfolioPreview.app/Contents/MacOS/MeetfolioPreview'
      - name: Copied app sandbox, preload and native module startup
        run: node desktop/scripts/native-smoke.mjs --executable 'work/phase5/mac-installed/MeetfolioPreview.app/Contents/MacOS/MeetfolioPreview' --out work/phase5/mac-native
      - name: Copied app exact segment playback and ownership guards
        run: node desktop/scripts/playback-smoke.mjs --executable 'work/phase5/mac-installed/MeetfolioPreview.app/Contents/MacOS/MeetfolioPreview' --out work/phase5/mac-playback
      - name: Copied app WAV MP3 M4A, bilingual ASR, voices, edits, exports and checkpoint resume
        run: |
          audio=$(node -p "JSON.parse(require('fs').readFileSync('work/phase4/ci-fixture/fixture.json')).audio")
          speakers=$(node -p "JSON.parse(require('fs').readFileSync('work/phase4/ci-fixture/fixture.json')).speakers")
          node desktop/scripts/readiness-smoke.mjs --executable 'work/phase5/mac-installed/MeetfolioPreview.app/Contents/MacOS/MeetfolioPreview' --audio "$audio" --speakers "$speakers" --encoder "$(command -v ffmpeg)" --minutes 4 --out work/phase5/mac-packaged
      - name: Remove only the test app copy and verify retained preview data
        run: node desktop/scripts/mac-preview-install.mjs --mode uninstall
      - name: Prepare verified macOS downloads and checksums
        run: node desktop/scripts/preview-artifacts.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: meetfolio-preview-macos-${{ matrix.arch }}
          path: work/phase5/downloads/darwin-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.arch }}-status-only
          path: |
            work/phase5/mac-source/readiness-smoke.json
            work/phase5/mac-installed/installation-status.json
            work/phase5/model-download/download-status.json
            work/phase5/mac-native/native-smoke.json
            work/phase5/mac-playback/playback-smoke.json
            work/phase5/mac-packaged/readiness-smoke.json
